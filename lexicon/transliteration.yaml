# Transliteración cirílica → latina (ISO 9 simplificado / esquema práctico).
# Clave = carácter cirílico, valor = equivalencia latina.
# Se usa en metadata_normalizer para que títulos/compositores cirílicos sean
# buscables y comparables en alfabeto latino (y viceversa por normalización).

cyrillic_to_latin:
  а: a
  б: b
  в: v
  г: g
  д: d
  е: e
  ё: yo
  ж: zh
  з: z
  и: i
  й: y
