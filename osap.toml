# osap.toml de DESARROLLO — SOLO conexión a la BD operativa de osap-api.
# El resto de configuración (deployment, dev_mode, credenciales de servicio, etc.)
# vive centralizado en la BD operativa (tabla app_config) y se puede sobreescribir
# por variable de entorno (OSAP_*). Precedencia: entorno > BD > defaults.
#
# NOTA: el fichero de PRODUCCIÓN es distinto y NO se sobrescribe en los deploys
# (el paquete de deploy no incluye osap.toml). Ver osap.production.example.toml.

[db]
host = "127.0.0.1"
name = "osap-api"
user = "osap2027"
password = "2027osapdb"

[oidc]
issuer = "http://osap-auth/auth-api"
client_id = "osap-api"
redirect_uri = "http://osap-app/api/v1/auth/oidc/callback"
spa_origin = "http://osap-app"
scope = "openid profile"
# Pon aquí el client_secret real (o en la env OSAP_OIDC_CLIENT_SECRET, que tiene prioridad).
# NO commitees un secreto real a git.
client_secret = ""
