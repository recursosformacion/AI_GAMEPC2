# OSAP Web (SPA) - app.openmusicrepository.com
# Versionado en osap-api/deploy y desplegado por script/deploy.ps1 (nginx).
# Modo mantenimiento (ADR-0037): maintenance.flag en el root de la SPA -> 503 con
# maintenance.html salvo assets, APIs y el bypass de revisión (cookie osap_preview).
#
# IMPORTANTE: el chequeo de mantenimiento va a NIVEL DE `server` (if + return). Si se
# pone dentro de `location /`, nginx deja de aplicar el `try_files` de la SPA y las rutas
# profundas (/viewer, /explore…) devuelven 404.
# Noindex para la SPA: rutas internas y cualquier URL con parámetros (estados de
# navegación). Se decide sobre `$request_uri` porque el `try_files` hace un redirect
# interno a /index.html y en ese punto se perdería el contexto del location original.
map $request_uri $spa_robots_tag {
    default "";
    "~^/(studio|composer|activity|admin|viewer|resolution|candidates|jobs|knowledge|providers|oidc|corrections)(/|$)" "noindex, nofollow";
    "~\?" "noindex, nofollow";
}

server {
    listen 80;
    listen [::]:80;
    server_name app.openmusicrepository.com;

    # HTTP -> HTTPS (canonical; evita duplicados http/https para SEO)
    location ~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.openmusicrepository.com;

    ssl_certificate /etc/letsencrypt/live/app.openmusicrepository.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.openmusicrepository.com/privkey.pem;

    root /home/ocw/openmusicrepository.com/app;
    index index.html;

    # --- Modo mantenimiento (ADR-0037), a nivel de server ---------------------
    # Activar/desactivar con script/maintenance.ps1 -On | -Off (crea o borra
    # maintenance.flag en el root). El público recibe 503 + maintenance.html;
    # el equipo revisa con https://app.openmusicrepository.com/?preview=<TOKEN>
    # (deja cookie osap_preview=1 durante 1 día). APIs y assets nunca se cortan.
    error_page 503 /maintenance.html;
    set $maint 0;
    if (-f /home/ocw/openmusicrepository.com/app/maintenance.flag) { set $maint 1; }
    if ($uri ~* "^/(assets/|favicon\.ico|robots\.txt|sitemap\.xml|BingSiteAuth\.xml|yandex_.*\.html|android-chrome|apple-touch|api/|auth/|support-api/|docs|openapi\.json|redoc|obra/|compositor/|sitemaps/|amigos/(corales/[^/]+|articulo/))") { set $maint 0; }
    if ($http_cookie ~* "osap_preview=1") { set $maint 0; }
    if ($maint = 1) { return 503; }

    location = /maintenance.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /maintenance.html =404;
    }

    # El HTML de la SPA nunca se cachea: los bundles llevan hash en el nombre, así que
    # revalidar index.html garantiza cargar siempre la versión desplegada. Sin esto el
    # navegador puede servir un index.html "heurísticamente" viejo que apunta a bundles
    # ya borrados por el deploy (la app se queda con JS antiguo).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Assets con hash: cacheables de forma agresiva; si no existen, 404 real (no index.html).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Manual de usuario: HTML estático sin hash en la URL, así que se revalida siempre
    # (evita servir una versión antigua del manual tras un despliegue).
    location ^~ /manual/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # OSAP Platform API (osap-api on 127.0.0.1:8001)
    location /api/ {
        proxy_pass http://osap_api;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # osap-auth (127.0.0.1:8200) - login/refresh del Web OSAP
    location /auth/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # osap-support (127.0.0.1:8300) - Donación/Membresía de la SPA v1
    location /support-api/ {
        rewrite ^/support-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API artifacts served by FastAPI at the root (docs, openapi, redoc)
    location ~ ^/(docs|openapi\.json|redoc)(/.*)?$ {
        proxy_pass http://osap_api;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Capa pública SEO (osap-api): HTML server-rendered de compositor, obra y representación.
    # El resto de la app sigue siendo la SPA (fallback /index.html).
    location ~ ^/(obra|compositor|representacion)/ {
        proxy_pass http://osap_api;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Capa pública de «Los amigos» (osap-api): página de grupo (`/amigos/corales/{id}[/{slug}]`)
    # y de artículo (`/amigos/articulo/{id}[/{slug}]`) con HTML real y metadatos sociales.
    # Los índices `/amigos` y `/amigos/corales` siguen siendo la SPA.
    location ~ ^/amigos/(corales/[^/]+|articulo/) {
        proxy_pass http://osap_api;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas internas de la SPA: nunca indexar (refuerza el <meta robots> de la app).
    # Se compara por segmento ((/|$)) para no capturar /composers (listado público).
    location ~ ^/(studio|composer|activity|admin|viewer|resolution|candidates|jobs|knowledge|providers|oidc|corrections)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    # Sitemaps dinámicos (osap-api): índice + páginas de obras/personas.
    location = /sitemap.xml {
        proxy_pass http://osap_api;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /sitemaps/ {
        proxy_pass http://osap_api;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (rutas profundas tipo /viewer -> index.html)
    location / {
        add_header X-Robots-Tag $spa_robots_tag always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
}
