# OSAP Web (SPA) - app.openmusicrepository.com
# Versionado en osap-api/deploy y desplegado por script/deploy.ps1 (nginx).
# Modo mantenimiento (ADR-0037): maintenance.flag en el root de la SPA -> 503 con
# maintenance.html salvo assets y el bypass de revisión (cookie osap_preview).
server {
    listen 80;
    listen [::]:80;
    server_name app.openmusicrepository.com;

    # HTTP -> HTTPS (canonical; evita duplicados http/https para SEO)
    location ~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.openmusicrepository.com;

    ssl_certificate /etc/letsencrypt/live/app.openmusicrepository.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.openmusicrepository.com/privkey.pem;

    root /home/ocw/openmusicrepository.com/app;
    index index.html;

    # --- Modo mantenimiento (ADR-0037) ---------------------------------------
    # Activar/desactivar con script/maintenance.ps1 -On | -Off (crea o borra
    # maintenance.flag en el root). El público recibe 503 + maintenance.html;
    # el equipo revisa con https://app.openmusicrepository.com/?preview=<TOKEN>
    # (deja cookie osap_preview=1 durante 1 día).
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /maintenance.html =404;
    }

    # OSAP Platform API (osap-api on 127.0.0.1:8001)
    location /api/ {
        proxy_pass http://osap_api;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # osap-auth (127.0.0.1:8200) - login/refresh del Web OSAP
    location /auth/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # osap-support (127.0.0.1:8300) - Donación/Membresía de la SPA v1
    location /support-api/ {
        rewrite ^/support-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API artifacts served by FastAPI at the root (docs, openapi, redoc)
    location ~ ^/(docs|openapi\.json|redoc)(/.*)?$ {
        proxy_pass http://osap_api;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (solo rutas reales; sin $uri/ para evitar 301 por barra final)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        set $maint 0;
        if (-f /home/ocw/openmusicrepository.com/app/maintenance.flag) { set $maint 1; }
        if ($uri ~* "^/(assets/|favicon\.ico|robots\.txt|sitemap\.xml|BingSiteAuth\.xml|android-chrome|apple-touch)") { set $maint 0; }
        if ($http_cookie ~* "osap_preview=1") { set $maint 0; }
        if ($maint = 1) { return 503; }
        try_files /index.html =404;
    }
    location / {
        set $maint 0;
        if (-f /home/ocw/openmusicrepository.com/app/maintenance.flag) { set $maint 1; }
        if ($uri ~* "^/(assets/|favicon\.ico|robots\.txt|sitemap\.xml|BingSiteAuth\.xml|android-chrome|apple-touch)") { set $maint 0; }
        if ($http_cookie ~* "osap_preview=1") { set $maint 0; }
        if ($maint = 1) { return 503; }
        try_files $uri /index.html;
    }

    location ~ /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_pass http://127.0.0.1:9180;
    }
}
