<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>OSAP — En mantenimiento</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a; color: #e2e8f0; padding: 1.5rem;
      }
      .card {
        max-width: 34rem; width: 100%; background: #111c33; border: 1px solid #24324f;
        border-radius: 16px; padding: 2rem; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35);
      }
      .badge {
        display: inline-block; padding: .3rem .8rem; border-radius: 999px;
        background: #7c3aed22; border: 1px solid #7c3aed66; color: #c4b5fd;
        font-size: .8rem; letter-spacing: .04em; text-transform: uppercase;
      }
      h1 { margin: 1rem 0 .5rem; font-size: 1.6rem; }
      p { margin: .5rem 0; line-height: 1.55; color: #cbd5e1; }
      .muted { color: #94a3b8; font-size: .9rem; }
      .en { margin-top: 1rem; font-size: .85rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">En mantenimiento</span>
      <h1>Estamos actualizando OSAP</h1>
      <p>
        El catálogo está en mantenimiento para publicar una nueva versión.
        Estará disponible de nuevo en unos minutos.
      </p>
      <p class="muted">Gracias por la paciencia.</p>
      <p class="en">We are updating OSAP. The catalogue will be back shortly.</p>
    </main>
    <script>
      (function () {
        var m = /[?&]preview=([^&]+)/.exec(window.location.search);
        if (!m) return;
        document.cookie = "osap_preview=1; path=/; max-age=86400; SameSite=Lax";
        window.location.replace(window.location.pathname + window.location.hash);
      })();
    </script>
  </body>
</html>
