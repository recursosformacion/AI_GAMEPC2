# Aplica transformaciones a los campos YA mapeados, en orden declarado.
# Ops simples: trim, lower, upper, empty_to_null, strip_parenthetical
# Op regex: {type: regex, pattern: ..., replace: ...}
fields:
  composer:
    - type: strip_parenthetical   # "W.A. Mozart (1756-1791)" -> "W.A. Mozart"
    - type: trim
  title:
    - type: trim

resources:
  format:
    - type: lower
