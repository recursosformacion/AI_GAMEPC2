id: cpdl
name: CPDL (resuelto vía OMR/osap-storage)
version: 1.3
enabled: true
priority: 100
# NO es un conector directo: no se conecta a cpdl.org. El contenido CPDL se sirve a través
# del proveedor `omr` (osap-storage). osap-api actúa como API; el usuario no conecta con CPDL.
base_url: https://storage.openmusicrepository.com
native_formats: [pdf]
authentication:
  type: none
protocol: via-omr        # resuelto por el proveedor omr; NO cablear conector directo
contract:
  version: 1.3
  search_endpoint: search
  lookup_endpoint: lookup
  resource_endpoint: resource
  download_endpoint: download
