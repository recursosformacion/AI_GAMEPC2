id: musopen
name: Musopen
version: 1.3
enabled: true
priority: 100
base_url: https://api.musopen.org/v1
native_formats: [pdf, musicxml, midi]
conversion: ninguno (a veces MusicXML directo)
authentication:
  type: api_key          # API deprecada; requiere API key; limitada a dominio publico
protocol: rest           # endpoint REST, pero key-gated y sin mantenimiento activo
contract:
  version: 1.3
  search_endpoint: search
  lookup_endpoint: lookup
  resource_endpoint: resource
  download_endpoint: download
