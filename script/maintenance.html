<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSAP — En mantenimiento</title>
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(135deg, #1e3a5f 0%, #0f1f35 100%);
      color: #f0f4f8; text-align: center; padding: 24px;
    }
    .card { max-width: 480px; }
    .logo { font-size: 2rem; font-weight: 700; letter-spacing: .08em; margin-bottom: 4px; }
    .logo span { color: #6fa8dc; }
    .gear {
      width: 56px; height: 56px; margin: 28px auto 20px; border-radius: 50%;
      border: 4px solid #6fa8dc; border-top-color: transparent;
      animation: spin 1.2s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.4rem; margin-bottom: 10px; }
    p { color: #c7d3e0; line-height: 1.5; }
    .tag { margin-top: 28px; font-size: .8rem; color: #8aa0b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">OSAP<span>.</span></div>
    <div class="gear"></div>
    <h1>Estamos en mantenimiento</h1>
    <p>Estamos actualizando la plataforma para mejorar tu experiencia.
       Vuelve en unos minutos.</p>
    <div class="tag">Open Music Repository &middot; openmusicrepository.com</div>
  </div>
</body>
</html>
