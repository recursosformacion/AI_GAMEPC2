# osap.toml de PRODUCCIÓN — SOLO conexión a la BD operativa de osap-api.
# El resto de la configuración vive en la BD (app_config) o en entorno (OSAP_*).
# Este fichero se despliega como osap.toml en el servidor (~/osap-api/osap.toml).

[db]
host = "127.0.0.1"
name = ""
user = ""
password = ""

[osap]
storage_web_base = "https://storage.openmusicrepository.com"

[oidc]
issuer = "https://auth.openmusicrepository.com/auth-api"
client_id = "osap-api"
redirect_uri = "https://api.openmusicrepository.com/api/v1/auth/oidc/callback"
spa_origin = "https://app.openmusicrepository.com"
scope = "openid profile"
# Verificación de access tokens (W1): JWKS de osap-auth + audiencia esperada + `iss` del token.
jwks_url = "https://auth.openmusicrepository.com/auth-api/auth/.well-known/jwks.json"
audience = "osap-api"
# `iss` de los access tokens: issuer raíz de osap-auth (NO el de discovery `/auth-api`).
token_issuer = "https://auth.openmusicrepository.com"
# Pon aquí el client_secret real (o en la env OSAP_OIDC_CLIENT_SECRET, con prioridad).
# En prod el secret va en el osap.toml del servidor / env del servicio; NO commitees el real.
client_secret = ""

[news]
# Servicio interno ai_noticias. No exponerlo fuera de la red del servidor.
base_url = "http://127.0.0.1:8401"
# Token de servicio; en producción va por entorno (OSAP_NEWS_API_TOKEN).
service_token = ""
timeout_seconds = 8


# Credenciales de client_credentials registradas en osap-auth.
# Los client_id deben ser UUID, no el nombre del cliente OIDC "osap-api".
# Pueden venir de este TOML, del entorno o de app_config.
[service]
client_id = ""
client_secret = ""
admin_client_id = ""
admin_client_secret = ""
# Cliente independiente: solo scope support:admin y audiencia osap-support.
support_admin_client_id = ""
support_admin_client_secret = ""

# Integración servidor-a-servidor con ai_publicidad.
[ads]
base_url = "http://127.0.0.1:8305"
service_token = ""
web_base = ""
